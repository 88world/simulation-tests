<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulation Tests · WebGL rigs</title>
<meta name="description" content="Five real-time WebGL 2 simulations running in the browser: shell-rendered fur in wind, a heightfield water surface, a million GPGPU particles, an effects composite, and a Navier–Stokes fluid solver.">
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23070B0F'/><circle cx='8' cy='8' r='3.4' fill='%232BC4C0'/></svg>">
</head>
<body>

<div class="shell" id="shell" data-panel="open">

  <header class="bar">
    <div class="bar__mark">
      <span class="bar__title">Simulation&nbsp;Tests</span>
      <span class="bar__sub">WebGL&nbsp;2 · real time</span>
    </div>

    <div class="bar__tabs" id="tabs" role="tablist" aria-label="Simulation rigs"></div>

    <div class="bar__actions">
      <label class="field" for="scale">
        <span class="field__label">Scale</span>
        <select id="scale" class="field__select">
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1" selected>100%</option>
        </select>
      </label>
      <button type="button" class="btn" id="play" data-state="running">
        <span class="btn__glyph" aria-hidden="true"></span>
        <span class="btn__label">Pause</span>
      </button>
      <button type="button" class="btn btn--icon" id="fullscreen" aria-label="Toggle fullscreen" title="Fullscreen">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <button type="button" class="btn btn--icon" id="panel-toggle" aria-expanded="true" aria-controls="panel" aria-label="Toggle parameters" title="Parameters">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="6" cy="4" r="1.8" fill="currentColor"/><circle cx="10.5" cy="8" r="1.8" fill="currentColor"/><circle cx="4.5" cy="12" r="1.8" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <div class="body">
    <section class="stage" id="stage">
      <canvas id="gl"></canvas>

      <p class="hint" id="hint"></p>

      <div class="stats" id="stats" aria-live="off"></div>

      <div class="overlay" id="overlay" hidden></div>
    </section>

    <aside class="panel" id="panel" aria-label="Parameters">
      <header class="panel__head">
        <div class="panel__id">
          <h1 class="panel__title" id="panel-title">—</h1>
          <span class="panel__method" id="panel-method">—</span>
        </div>
        <p class="panel__blurb" id="panel-blurb"></p>
      </header>
      <div class="panel__body" id="panel-body"></div>
      <footer class="panel__foot">
        <span>Space pauses · 1–5 switch rigs</span>
      </footer>
    </aside>
  </div>

</div>

<script src="js/core.js"></script>
<script src="js/glsl.js"></script>
<script src="js/rig-fur.js"></script>
<script src="js/rig-water.js"></script>
<script src="js/rig-particles.js"></script>
<script src="js/rig-vfx.js"></script>
<script src="js/rig-smoke.js"></script>
<script src="js/main.js"></script>

</body>
</html>
